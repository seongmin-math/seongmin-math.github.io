- title: 'Irreducible $\mathrm{SL}_2(\mathbb{R})$-action on projective $k$-lattices and Frobenius numbers'
  journal: "preprint"
  info: "arxiv:2611.23579"
  year: 2026
  link: "https://arxiv.org/abs/2611.23579"
  coauthor:
    - name: "Michael Bersudsky"
      link: "https://sites.google.com/view/bmichael/"
    - name: "Seonhee Lim"
      link: "https://sites.google.com/view/seonheelim/"
  absract: >
    The irreducible representation of $\mathrm{SL}_2(\mathbb{R})$ on $\mathbb{R}^n$ induces an action on the space $X_k(\mathbb{R}^n)$ of projective classes of rank $k$-discrete subgroups in $\mathbb{R}^n$.
    For every lattice subgroup of $\mathrm{SL}_2(\mathbb{R})$ and every starting point in $X_k(\mathbb{R}^n)$ and $2\geq k<n$, we prove convergence of the orbit averages over expanding norm balls and give a complete, explicit description of their limits.

    In an overview, every limit is supported on the subbundle over the unique compact $\mathrm{SL}_2(\mathbb{R})$-orbit in the Grassmannian.
    The conditional measures on the fibers are either uniform on finite sets or convex combinations of at most two homogeneous measures associated with split simple subgroups of $\mathrm{PGL}_k(\mathbb{R})$ containing the principal $\mathrm{SL}_2(\mathbb{R})$.

    Another objective of our work is to relate weak-* limits of probability measures on $X_{n−1}(\mathbb{R}^n)$ supported on the projective classes of lattices orthogonal to integer vectors with limiting distributions of the corresponding normalized Frobenius numbers.
    This correspondence gives limit laws for vectors sampled from certain proper subvarieties, extending J. Marklof's work on sampling from full-dimensional domains.
    Specifically, together with our results for $\mathrm{SL}_2(\mathbb{Z})$ orbits in $X_{n−1}(\mathbb{R}^n)$, this correspondence gives limit laws for primitive integer vectors sampled from $\mathrm{SL}_2(\mathbb{R})$-orbits.
    Using an earlier result of the first author and Shapira, we obtain analogous laws for integer vectors sampled on level sets of certain quadratic forms, as the level tends to infinity.


- title: "Khintchine's theorem for inhomogeneous simultaneous approximation with polynomial decay"
  journal: "preprint"
  info: "arXiv:2604.22689"
  year: 2026
  link: "https://arxiv.org/abs/2604.22689"
  abstract: >
    Khintchine's theorem on the measure dichotomy for the set of $\psi$-approximable numbers has been generalized to inhomogeneous and higher-dimensional settings. Allen and Ramírez conjectured that the monotonicity condition can be removed in the inhomogeneous $nm=2$ cases. In this paper, we resolve the $(n,m)=(1,2)$ case for $\psi$ satisfying a polynomial decay condition $\psi(q)=O(q^{-\delta})$ for some $\delta>0.$


- title: "Inhomogeneous Khintchine—Groshev theorem without monotonicity"
  journal: "Bull. London Math. Soc."
  info: "57: 2639-2657"
  year: 2025
  link: "https://londmathsoc.onlinelibrary.wiley.com/doi/full/10.1112/blms.70114"
  abstract: >
    The Khintchine--Groshev theorem in Diophantine approximation theory says that there is a dichotomy of the Lebesgue measure of sets of $\psi$-approximable numbers, given a monotonic function $\psi$. Allen and Ramírez removed the monotonicity condition from the inhomogeneous Khintchine--Groshev theorem for cases with $nm\geq3$ and conjectured that it also holds for $nm=2$. In this paper, we prove this conjecture in the case of $(n,m)=(2,1)$. We also prove it for the case of $(n,m)=(1,2)$ with a rational inhomogeneous parameter.
